server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Live investigations (GDELT search + article fetch + detector scoring)
    # take several seconds; SSE streaming needs buffering off to actually
    # stream rather than arrive all at once when the response finishes.
    location /api/ {
        proxy_pass http://backend:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
